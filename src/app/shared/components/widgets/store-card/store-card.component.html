<div class="card">
  <div>
    <img
      style="margin: auto; height: 130px; display: block"
      [src]="store!.logo"
      loading="lazy"
      [alt]="'Logo '+store!.name"
    />
    <h5 class="ion-no-margin text-medium ion-margin-top text-gray ion-text-start">
      {{ store.name }}
    </h5>
      <p class="text-sm">
        {{ store.city }} | {{ store.articles.length > 0 ? store.articles.length : "Aucun" }} articles
      </p>
  </div>
  <ion-row class="btn-row mt">
    <ion-col size="12">
      <button
        (click)="onViewDetail()"
        class="ion-activatable ripple-parent custom-parent btn-primary"
      >
        <ion-label>Voir detail</ion-label>
        <ion-ripple-effect></ion-ripple-effect>
      </button>
    </ion-col>
  </ion-row>
</div>
